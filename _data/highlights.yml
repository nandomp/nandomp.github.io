# ==========================================================================
# Highlights / news — rendered on the homepage by _includes/highlights.html
#
# Every item uses the SAME rendering, whether it appears in the short
# "Recent highlights" list or in the full archive below it. Items are grouped
# by year and the year label is printed once per group, so this file MUST
# stay ordered by year, newest first.
#
# Fields
#   year       required. Integer. Groups the item; shown once per group.
#   title      required. Plain text.
#   url        optional. If set, the title links here.
#   venue      optional. Small badge under the title.
#   venue_url  optional. Makes the venue badge a link.
#   note       optional. Markdown, rendered under the title.
#   links      optional. List of { label, url } rendered as extra badges.
# ==========================================================================

