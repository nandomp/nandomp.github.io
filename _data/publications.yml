# ==========================================================================
# Publications — single source of truth for /publications/
#
# Every entry renders as:
#   Authors. “Title”. Venue, details, Year.  [DOI] [PDF] [Code] …
#
# Fields
#   title      required. No surrounding quotes — the template adds them.
#   url        optional. Primary link, applied to the title.
#   authors    required. Full list, in order. Write the site owner's name
#              exactly as "Fernando Martínez-Plumed" — the template bolds it
#              automatically, so no markup is needed here.
#   venue      required. Journal/conference name + acronym (+ edition year for
#              conferences). No dates, no locations.
#   venue_url  required. Journal or conference series homepage (DBLP when the
#              series has no stable official site).
#   details    optional. Volume / issue / pages / publisher / status.
#   type       required. journal | conference | workshop | chapter |
#              report | preprint | thesis
#   award      optional. Rendered as a small highlighted badge.
#   links      optional. Action pills, ALWAYS in this order:
#              DOI, Paper, PDF, arXiv, OpenReview, Code, Project, Slides,
#              Poster, BibTeX, Appendix.
# ==========================================================================

